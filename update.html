<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>FatSub 更新下載</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif; text-align: center; padding: 60px 20px; background: #1a1a1a; color: #e0e0e0; margin: 0; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .detected { color: #00bcd4; font-size: 14px; margin-bottom: 30px; }
  .spinner { border: 3px solid #333; border-top-color: #00bcd4; border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #999; line-height: 1.8; font-size: 13px; }
  #manual { display: none; margin-top: 30px; padding: 20px; background: #2a2a2a; border-radius: 8px; max-width: 400px; margin-left: auto; margin-right: auto; }
  a { color: #00bcd4; text-decoration: none; margin: 0 10px; }
  a:hover { text-decoration: underline; }
  .check { color: #00bcd4; font-size: 14px; letter-spacing: 2px; margin: 10px auto 20px; line-height: 1; }
  .retry-btn { display: inline-block; margin-top: 16px; padding: 8px 18px; background: transparent; color: #00bcd4; border: 1px solid #00bcd4; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .retry-btn:hover { background: #00bcd4; color: #1a1a1a; }

  /* ===== 問卷區塊：更新頁是唯一能接觸到「裝了但沒留信箱」那群人的地方 ===== */
  #survey { display: none; margin: 36px auto 0; padding: 26px 24px; background: #2a2a2a; border: 1px solid #383838; border-radius: 10px; max-width: 460px; text-align: left; }
  #survey h2 { font-size: 17px; margin: 0 0 12px; color: #e0e0e0; }
  #survey p { color: #b0b0b0; font-size: 13.5px; line-height: 1.9; margin: 0 0 18px; }
  #survey a.survey-btn { display: block; margin: 0; padding: 12px; text-align: center; background: #00bcd4; color: #1a1a1a; border-radius: 8px; font-size: 15px; font-weight: 600; }
  #survey a.survey-btn:hover { background: #00d4ef; text-decoration: none; color: #1a1a1a; }
  #survey .later { color: #777; font-size: 12px; text-align: center; margin: 12px 0 0; }
</style>
</head>
<body>

<!--
  update.html — 給「App 內按前往下載」的老客戶用的更新頁。
  刻意「沒有 email 關卡」:老客戶抓更新不該被逼再留一次 mail(那會污染下載名單)。
  官網潛客請走 download.html(有 gate,負責捕捉名單)。兩頁分工,別合併。
-->
<h1 id="title">FatSub 更新下載中...</h1>
<p class="detected" id="detected">正在偵測你的系統</p>
<div id="check" class="check" style="display:none;">— DOWNLOAD STARTED —</div>
<div id="spinner" class="spinner"></div>
<p id="hint">如果沒有自動開始下載,請稍候幾秒,或點下方手動選擇。</p>
<div id="manual">
  <p style="margin-top:0;" id="manual-title">手動選擇版本:</p>
  <a id="mac-link" href="#">Mac</a>
  <a id="win-link" href="#">Windows</a>
  <a href="https://fathub.tw/fatsub/">官方網站</a>
  <div><span class="retry-btn" id="retry-btn" style="display:none;">重新下載</span></div>
</div>

<div id="survey">
  <h2>想請大家幫個忙</h2>
  <p>
    FatSub 接下來要做什麼,我想先聽大家的意見。<br>
    花一分鐘填份問卷,告訴我你平常都剪什麼、最需要什麼。<br>
    順便留個信箱,新版上線我第一時間通知大家。
  </p>
  <a class="survey-btn" id="survey-link" href="#" target="_blank" rel="noopener">我來填(約 1 分鐘)</a>
  <p class="later">不填也完全不影響使用,更新已經下載好了。</p>
</div>

<script>
// ===== CONFIG =====
// GitHub 的下載數把「新用戶下載」和「老用戶更新」算在同一顆 dmg/exe 上，分不開。
// 這頁只有老用戶會進來（App 內按「前往下載」），所以在這裡靜默記一筆，
// 之後就能算：真實新用戶 ≒ 總下載數 − 這裡的更新次數。
// 不收 email、不擋人，純計數。留空 = 不送，行為跟以前完全一樣。
const EVENT_FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSdGAhUSaTfI9QONC4j3gRQLlOrt2hfgLVMRsFuHRdsbyEv3SA/formResponse';
const EMAIL_ENTRY = 'entry.2042206199';   // 這頁一律送固定值，不是真的信箱
const SOURCE_ENTRY = 'entry.583188982';                  // 「來源」題的 entry ID，留空則整筆不送
const PLATFORM_ENTRY = 'entry.1433476378';                // 「平台」題的 entry ID，可留空
// 佔位 email。刻意長得像 email（儀表板的 CSV 解析靠 @ 認欄位），且不含逗號（含逗號會撞切欄）。
// 儀表板認得這個網域，會把它排除在名單外、單獨算成「更新次數」。
const UPDATE_MARKER = 'update@fatsub.internal';
// SURVEY_URL：問卷表單網址（另開一張表，別跟下載名單混在同一張）。
// 這頁是唯一能接觸到「裝了 FatSub 但從沒留過信箱」那群人的地方 —— 他們一定會經過這裡。
// 留空 = 整塊問卷不顯示，頁面行為跟以前完全一樣。
const SURVEY_URL = '';
// ==================

const MAC_URL = 'https://github.com/james594007-bit/fatsub-updates/releases/latest/download/FatSub-arm64.dmg';
const WIN_URL = 'https://github.com/james594007-bit/fatsub-updates/releases/latest/download/FatSub-Setup.exe';
const FALLBACK = 'https://fathub.tw/fatsub/';

const ua = navigator.userAgent;
const platform = navigator.platform || '';

// App 若有帶 ?os=mac / ?os=win 就以參數為準，沒帶才靠 UA 猜
const osParam = (new URLSearchParams(location.search).get('os') || '').toLowerCase();

let targetUrl = FALLBACK;
let platformName = '未知系統,導向官網';
let osKey = 'unknown';
if (osParam === 'mac' || osParam === 'win') {
  osKey = osParam;
  targetUrl = osParam === 'mac' ? MAC_URL : WIN_URL;
  platformName = osParam === 'mac' ? '正在下載 Mac 版' : '正在下載 Windows 版';
} else if (/Mac|iPhone|iPad|iPod/.test(ua) || /Mac/.test(platform)) {
  osKey = 'mac';
  targetUrl = MAC_URL;
  platformName = '偵測到 macOS,正在下載 Mac 版';
} else if (/Windows/.test(ua) || /Win/.test(platform)) {
  osKey = 'win';
  targetUrl = WIN_URL;
  platformName = '偵測到 Windows,正在下載 Windows 版';
}

// 靜默計數：失敗、被擋、離線都無所謂，絕不影響下載
if (SOURCE_ENTRY) {
  try {
    const body = new URLSearchParams();
    body.append(EMAIL_ENTRY, UPDATE_MARKER);
    body.append(SOURCE_ENTRY, '更新');
    if (PLATFORM_ENTRY) body.append(PLATFORM_ENTRY, osKey);
    fetch(EVENT_FORM_ACTION, { method: 'POST', mode: 'no-cors', body }).catch(() => {});
  } catch (e) {}
}

document.getElementById('detected').textContent = platformName;
document.getElementById('mac-link').href = MAC_URL;
document.getElementById('win-link').href = WIN_URL;

function triggerDownload() {
  const a = document.createElement('a');
  a.href = targetUrl;
  a.rel = 'noopener';
  a.download = '';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// 沒有 gate:進頁面直接開始下載
if (targetUrl === FALLBACK) {
  setTimeout(() => { window.location.href = targetUrl; }, 600);
  setTimeout(() => { document.getElementById('manual').style.display = 'block'; }, 2500);
} else {
  setTimeout(triggerDownload, 600);
  setTimeout(() => {
    document.getElementById('title').textContent = '下載已開始';
    document.getElementById('detected').textContent = '請查看瀏覽器下載列 / Downloads 資料夾';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('check').style.display = 'block';
    document.getElementById('hint').innerHTML = '檔案正在下載中,完成後可關閉此頁面。<br>若沒看到下載開始,請從下方手動選擇或點「重新下載」。';
    document.getElementById('manual').style.display = 'block';
    document.getElementById('manual-title').textContent = '其他選項:';
    const retry = document.getElementById('retry-btn');
    retry.style.display = 'inline-block';
    retry.onclick = triggerDownload;
    // 問卷擺在下載開始「之後」才出現：先把人要的東西給他，再開口請他幫忙
    if (SURVEY_URL) {
      document.getElementById('survey-link').href = SURVEY_URL;
      document.getElementById('survey').style.display = 'block';
    }
  }, 1500);
}
</script>
</body>
</html>
